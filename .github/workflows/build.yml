name: Build Superset with LGA Count Map

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repository (holds the patch)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          free -h

      - name: Get Superset 6.1.0 and apply the LGA map patch
        run: |
          git clone --depth 1 --branch 6.1.0 https://github.com/apache/superset.git superset
          cd superset
          git apply ../lga-map.patch

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: superset
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/superset-lga:6.1.0-lga"
          docker build -f Dockerfile.lga \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "Image pushed: ${IMAGE}" | tee -a "$GITHUB_STEP_SUMMARY"
